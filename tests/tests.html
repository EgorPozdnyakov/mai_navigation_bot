<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тесты — карта МАИ</title>
  <!-- Те же проверки, что и «node --test», но в браузере.
       Открывать через сервер: python -m http.server → http://localhost:8000/tests/tests.html -->
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 16px; }
    .ok { color: #1e7b34; }
    .fail { color: #b42318; }
    pre { white-space: pre-wrap; background: #f1f3f5; padding: 8px; }
  </style>
</head>
<body>
  <h1>Проверки</h1>
  <p id="summary">Выполняем…</p>
  <ul id="results"></ul>
  <script type="module">
    import { cases } from './cases.js';

    let failed = 0;
    for (const [name, run] of cases) {
      const item = document.createElement('li');
      try {
        await run();
        item.className = 'ok';
        item.textContent = '✓ ' + name;
      } catch (error) {
        failed++;
        item.className = 'fail';
        item.innerHTML = '✗ ' + name + '<pre></pre>';
        item.querySelector('pre').textContent = error.message;
      }
      document.getElementById('results').append(item);
    }
    const summary = document.getElementById('summary');
    summary.textContent = failed === 0 ? `Все проверки прошли: ${cases.length}` : `Не прошли: ${failed} из ${cases.length}`;
    summary.className = failed === 0 ? 'ok' : 'fail';
  </script>
</body>
</html>
